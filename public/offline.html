<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F4EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151013" media="(prefers-color-scheme: dark)">
<title>Offline · Samson</title>
<style>
  @font-face{font-family:"Romie";src:url(/fonts/Romie-Light.woff2) format("woff2");font-weight:300;font-display:swap}
  @font-face{font-family:"Caslon Doric";src:url(/fonts/CaslonDoric-Regular-Web.woff2) format("woff2");font-weight:400;font-display:swap}
  :root{--ground:#F7F4EC;--ink:#1A1A1A;--muted:#6F6A62;--accent:#521033;--rule:#DFD8C6;--surface:#fff}
  @media(prefers-color-scheme:dark){:root{--ground:#151013;--ink:#EEE9E1;--muted:#A49C92;--accent:#E8DFAD;--rule:#332B31;--surface:#1D171B}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--ink)}
  body{
    font-family:"Caslon Doric",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1rem;text-align:center;
    padding:calc(2rem + env(safe-area-inset-top,0px)) 1.5rem calc(2rem + env(safe-area-inset-bottom,0px));
    -webkit-tap-highlight-color:transparent;
  }
  h1{font-family:"Romie",Georgia,serif;font-weight:300;font-size:1.9rem;margin:0}
  p{margin:0;color:var(--muted);max-width:22rem;line-height:1.55}
  a{
    display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 1.25rem;
    border:1px solid var(--rule);background:var(--surface);color:var(--ink);
    text-decoration:none;border-radius:2px;margin-top:.5rem;touch-action:manipulation;
  }
</style>
</head>
<body>
  <h1>No signal</h1>
  <p>Samson could not reach the lodge's diary. Days you have already opened are still available offline.</p>
  <a href="/">Try again</a>
  <script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
